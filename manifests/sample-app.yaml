# Minimal Deployment + Service exposing a container-native load balancing
# NEG, so the Service can be attached as a backend to the regional external
# HTTPS LB created by scripts/01-create-regional-lb.sh.
#
# The NEG name GKE generates is discoverable after apply via:
#   kubectl get svc sample-app -o jsonpath='{.metadata.annotations.cloud\.google\.com/neg-status}'
#
# NOTE on /healthz: gcr.io/google-samples/hello-app:2.0 does not implement
# a dedicated /healthz route. Its Go handler is registered on "/" only,
# which Go's default http.ServeMux treats as a catch-all for any path
# that has no more specific handler -- so a GET to /healthz (or any other
# path) still hits that handler and returns 200. That's why the readiness
# probe and the backend health checks in 01-create-regional-lb.sh and
# 03-test-failover.sh, which all target /healthz, work correctly here.
# It's not accidental breakage, but it IS a coincidence of this specific
# image rather than a real health endpoint -- if you swap in your own
# app image, make sure it actually implements /healthz (checking real
# dependencies, not just "process is up") before relying on this same
# health-check path.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
  labels:
    app: sample-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-app
  template:
    metadata:
      labels:
        app: sample-app
    spec:
      containers:
        - name: sample-app
          image: gcr.io/google-samples/hello-app:2.0
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sample-app
  annotations:
    # Named for what it fronts (HTTPS at the LB, plain HTTP to the pod) --
    # was "cluster-region-neg", renamed for clarity when reading NEG
    # listings across multiple regions/services.
    cloud.google.com/neg: '{"exposed_ports": {"443":{"name": "sample-app-https-neg"}}}'
spec:
  type: ClusterIP
  selector:
    app: sample-app
  ports:
    - port: 443
      targetPort: 8080
